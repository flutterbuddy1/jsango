<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JSango Voice Agent</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 16px;
      }
      button {
        font-size: 1rem;
        padding: 0.5rem 1rem;
      }
      #log p {
        margin: 0.25rem 0;
      }
      .you {
        color: #2563eb;
      }
      .error {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <h1>Voice agent</h1>
    <p>Click Start and ask "Where is order A100?". Talk over the agent to interrupt it.</p>
    <p>
      <button id="start">Start</button> <button id="stop" disabled>Stop</button>
      <span id="status"></span>
    </p>
    <form id="form"><input id="text" placeholder="…or type a message" disabled /></form>
    <div id="log"></div>

    <script type="module">
      // The server speaks PCM16 mono audio at 24 kHz in both directions.
      const RATE = 24000;
      const $ = (id) => document.getElementById(id);
      const log = (text, cls = '') => {
        const p = document.createElement('p');
        p.className = cls;
        p.textContent = text;
        $('log').prepend(p);
      };

      // ── Microphone: an AudioWorklet turns each mic buffer into PCM16 bytes ──
      const MIC = `
        registerProcessor('mic', class extends AudioWorkletProcessor {
          process([input]) {
            const samples = input[0];
            if (samples) {
              const pcm = Int16Array.from(samples, (s) => Math.max(-1, Math.min(1, s)) * 0x7fff);
              this.port.postMessage(pcm.buffer, [pcm.buffer]);
            }
            return true;
          }
        });`;

      let ws, audio, mic;

      // ── Speaker: play the agent's audio chunks back to back ──
      let playAt = 0; // when the next chunk starts
      let replyStart = 0; // when the current reply started playing
      let playing = [];

      function play(bytes) {
        const pcm = new Int16Array(bytes);
        const buffer = audio.createBuffer(1, pcm.length, RATE);
        buffer.getChannelData(0).set(Float32Array.from(pcm, (v) => v / 0x8000));
        const source = audio.createBufferSource();
        source.buffer = buffer;
        source.connect(audio.destination);
        if (playing.length === 0) replyStart = playAt = Math.max(playAt, audio.currentTime);
        source.start(playAt);
        playAt += buffer.duration;
        playing.push(source);
        source.onended = () => (playing = playing.filter((s) => s !== source));
      }

      // The user talked over the agent: stop playing and tell the server how much they heard.
      function interrupt() {
        if (playing.length === 0) return;
        const heardMs = (audio.currentTime - replyStart) * 1000;
        playing.forEach((s) => s.stop());
        playing = [];
        ws.send(JSON.stringify({ type: 'interrupt', playedMs: heardMs }));
      }

      // ── Messages from the server ──
      function onMessage({ data }) {
        if (data instanceof ArrayBuffer) return play(data); // binary = agent audio
        const event = JSON.parse(data);
        if (event.type === 'ready') startMicrophone();
        if (event.type === 'speech.started') interrupt();
        if (event.type === 'transcript') {
          const you = event.role === 'user';
          log(`${you ? 'You' : 'Agent'}: ${event.text}`, you ? 'you' : '');
        }
        if (event.type === 'tool.started') log(`(looking up with ${event.name}…)`);
        if (event.type === 'error') log(event.error, 'error');
      }

      function startMicrophone() {
        const node = new AudioWorkletNode(audio, 'mic');
        node.port.onmessage = (e) => ws.readyState === WebSocket.OPEN && ws.send(e.data);
        audio.createMediaStreamSource(mic).connect(node);
        $('status').textContent = 'listening — just talk';
        $('text').disabled = false;
      }

      $('start').onclick = async () => {
        $('start').disabled = true;
        $('stop').disabled = false;
        $('status').textContent = 'connecting…';
        audio = new AudioContext({ sampleRate: RATE });
        const worklet = new Blob([MIC], { type: 'text/javascript' });
        await audio.audioWorklet.addModule(URL.createObjectURL(worklet));
        mic = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true },
        });
        ws = new WebSocket(
          `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/voice`
        );
        ws.binaryType = 'arraybuffer';
        ws.onmessage = onMessage;
        ws.onclose = stop;
      };

      function stop() {
        ws?.close();
        mic?.getTracks().forEach((t) => t.stop());
        if (audio && audio.state !== 'closed') audio.close();
        playing = [];
        $('start').disabled = false;
        $('stop').disabled = true;
        $('text').disabled = true;
        $('status').textContent = 'stopped';
      }
      $('stop').onclick = stop;

      // ── Typed messages work too ──
      $('form').onsubmit = (e) => {
        e.preventDefault();
        const text = $('text').value.trim();
        if (!text || ws?.readyState !== WebSocket.OPEN) return;
        interrupt();
        ws.send(JSON.stringify({ type: 'text', text }));
        $('text').value = '';
      };
    </script>
  </body>
</html>
