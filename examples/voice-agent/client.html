<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JSango Voice Agent</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 16px;
      }
      button {
        font-size: 1rem;
        padding: 0.5rem 1rem;
      }
      #log p {
        margin: 0.25rem 0;
      }
      .user {
        color: #2563eb;
      }
      .error {
        color: #dc2626;
      }
      .muted {
        color: #6b7280;
        font-size: 0.875rem;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>Voice agent</h1>
    <p class="muted">
      Ask about an order (try "Where is order A100?") or support hours. Talk over the agent to
      interrupt it. Mode: <span id="mode">…</span>
    </p>
    <p>
      <button id="start">Start</button>
      <button id="startRtc" hidden>Start (WebRTC)</button>
      <button id="stop" disabled>Stop</button>
      <span id="status"></span>
    </p>
    <form id="textForm"><input id="text" placeholder="…or type a message" disabled /></form>
    <div id="log"></div>

    <script type="module">
      // Microphone -> PCM16 mono 24 kHz, sent to the server as binary frames.
      const MIC_WORKLET = `
      class Mic extends AudioWorkletProcessor {
        process([input]) {
          const ch = input[0];
          if (ch) {
            const pcm = new Int16Array(ch.length);
            for (let i = 0; i < ch.length; i++) pcm[i] = Math.max(-1, Math.min(1, ch[i])) * 0x7fff;
            this.port.postMessage(pcm.buffer, [pcm.buffer]);
          }
          return true;
        }
      }
      registerProcessor('mic', Mic);`;

      const $ = (id) => document.getElementById(id);
      const log = (text, cls = '') => {
        const p = document.createElement('p');
        p.className = cls;
        p.textContent = text;
        $('log').prepend(p);
      };

      let ws, ctx, mic, pc;
      let interrupt = () => {};
      window.addEventListener('voice:interrupt', () => interrupt());

      const config = await (await fetch('/config')).json();
      $('mode').textContent = config.mode;
      $('startRtc').hidden = !config.webrtc;
      const busy = (on) => {
        $('start').disabled = on;
        $('startRtc').disabled = on;
        $('stop').disabled = !on;
      };

      // WebRTC: audio goes browser <-> provider directly; the server runs the tools.
      $('startRtc').onclick = async () => {
        busy(true);
        $('status').textContent = 'connecting…';
        pc = new RTCPeerConnection();
        const player = new Audio();
        player.autoplay = true;
        pc.ontrack = (e) => (player.srcObject = e.streams[0]);
        mic = await navigator.mediaDevices.getUserMedia({ audio: true });
        pc.addTrack(mic.getTracks()[0]);
        const events = pc.createDataChannel('oai-events');
        events.onmessage = ({ data }) => {
          const e = JSON.parse(data);
          if (e.type === 'conversation.item.input_audio_transcription.completed')
            log(`You: ${e.transcript}`, 'user');
          if (e.type === 'response.output_audio_transcript.done') log(`Agent: ${e.transcript}`);
        };
        await pc.setLocalDescription(await pc.createOffer());
        const res = await fetch('/voice/rtc', {
          method: 'POST',
          body: pc.localDescription.sdp,
          headers: { 'Content-Type': 'application/sdp' },
        });
        if (!res.ok) {
          log('Could not start the call', 'error');
          return stopAll();
        }
        await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
        $('status').textContent = 'listening — just talk';
      };

      const stopAll = () => {
        ws?.close();
        pc?.close();
        pc = undefined;
        mic?.getTracks().forEach((t) => t.stop());
        $('status').textContent = 'closed';
        $('text').disabled = true;
        busy(false);
      };

      $('start').onclick = async () => {
        busy(true);
        ctx = new AudioContext({ sampleRate: 24000 });
        const workletUrl = URL.createObjectURL(
          new Blob([MIC_WORKLET], { type: 'text/javascript' })
        );
        await ctx.audioWorklet.addModule(workletUrl);
        mic = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true },
        });
        ws = new WebSocket(
          `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/voice`
        );
        ws.binaryType = 'arraybuffer';
        $('status').textContent = 'connecting…';

        // Playback: chunks are scheduled back to back. replyStart lets us report how much of the
        // current reply was heard when the user interrupts.
        let playAt = 0;
        let replyStart = 0;
        let newReply = true;
        let sources = [];
        const stopPlayback = () => {
          const heardMs = Math.max(0, (ctx.currentTime - replyStart) * 1000);
          sources.forEach((s) => s.stop());
          sources = [];
          playAt = 0;
          newReply = true;
          return heardMs;
        };

        interrupt = () => {
          if (sources.length)
            ws.send(JSON.stringify({ type: 'interrupt', playedMs: stopPlayback() }));
        };

        ws.onmessage = ({ data }) => {
          if (data instanceof ArrayBuffer) {
            const pcm = new Int16Array(data);
            const buffer = ctx.createBuffer(1, pcm.length, 24000);
            buffer.getChannelData(0).set(Float32Array.from(pcm, (v) => v / 0x8000));
            const src = ctx.createBufferSource();
            src.buffer = buffer;
            src.connect(ctx.destination);
            playAt = Math.max(playAt, ctx.currentTime);
            if (newReply) {
              replyStart = playAt;
              newReply = false;
            }
            src.start(playAt);
            playAt += buffer.duration;
            sources.push(src);
            src.onended = () => (sources = sources.filter((s) => s !== src));
            return;
          }
          const event = JSON.parse(data);
          if (event.type === 'ready') {
            const node = new AudioWorkletNode(ctx, 'mic');
            node.port.onmessage = (e) => ws.readyState === WebSocket.OPEN && ws.send(e.data);
            ctx.createMediaStreamSource(mic).connect(node);
            $('status').textContent = 'listening — just talk';
            $('text').disabled = false;
          } else if (event.type === 'speech.started') {
            // The user talked over the agent: stop playing and say how much was heard.
            if (sources.length)
              ws.send(JSON.stringify({ type: 'interrupt', playedMs: stopPlayback() }));
          } else if (event.type === 'response.done') {
            newReply = true;
            if (event.latency?.firstAudioMs !== undefined)
              log(`(first audio after ${event.latency.firstAudioMs} ms)`, 'muted');
          } else if (event.type === 'transcript') {
            log(`${event.role === 'user' ? 'You' : 'Agent'}: ${event.text}`, event.role);
          } else if (event.type === 'tool.started') {
            log(`(using ${event.name}…)`);
          } else if (event.type === 'error') {
            log(event.error, 'error');
          }
        };
        ws.onclose = () => {
          ctx?.close();
          stopAll();
        };
      };

      $('stop').onclick = stopAll;
      $('textForm').onsubmit = (e) => {
        e.preventDefault();
        if (!$('text').value || ws?.readyState !== WebSocket.OPEN) return;
        window.dispatchEvent(new Event('voice:interrupt'));
        ws.send(JSON.stringify({ type: 'text', text: $('text').value }));
        log(`You: ${$('text').value}`, 'user');
        $('text').value = '';
      };
    </script>
  </body>
</html>
